---
Betreff: 'Eine neue App wurde in Ihrem Team erstellt'
---

<container>
  <row>
    <columns small="12">
      <h4>Neue App erstellt</h4>
      <p>${actor} hat eine App in Ihrem Team erstellt.</p>
      <p><strong>App-Name:</strong> ${app_name}<br>
         <strong>Datum:</strong> ${date}</p>
      <p><strong>Team-Name:</strong> ${team_name}<br>
         <strong>Team-ID:</strong> ${team_id}</p>
      <p><strong>Berechtigungen:</strong><br>
         <ul>${permissions}</ul></p>
      <div style="height: 16px;"></div>
      <div style="text-align: center;"><button href="${url}" class="radius">Team-Management öffnen</button></div>
      <div style="height: 8px;"></div>
      {{> de/questions}}
    </columns>
  </row>
</container>
{{> de/footer}}
