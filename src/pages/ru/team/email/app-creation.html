---
тема: 'В вашей команде создано новое приложение'
---

<container>
  <row>
    <columns small="12">
      <h4>Создано новое приложение</h4>
      <p>${actor} создал приложение в вашей команде.</p>
      <p><strong>Название приложения:</strong> ${app_name}<br>
         <strong>Дата:</strong> ${date}</p>
      <p><strong>Team name:</strong> ${team_name}<br>
         <strong>Team ID:</strong> ${team_id}</p>
      <p><strong>Права доступа:</strong><br>
         <ul>${permissions}</ul></p>
      <div style="height: 16px;"></div>
      <div style="text-align: center;"><button href="${url}" class="radius">Открыть управление командой</button></div>
      <div style="height: 8px;"></div>
      {{> ru/questions}}
    </columns>
  </row>
</container>
{{> ru/footer}}
