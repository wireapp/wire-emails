---
subject: 'Une application a été supprimée de votre équipe'
---

<container>
  <row>
    <columns small="12">
      <h4>Application supprimée</h4>
      <p>${actor} a supprimé une application dans votre équipe.</p>
      <p><strong>Nom de l'application :</strong> ${app_name}<br>
         <strong>Date :</strong> ${date}</p>
      <p><strong>Nom de l'équipe :</strong> ${team_name}<br>
         <strong>ID de l'équipe :</strong> ${team_id}</p>
      <div style="height: 16px;"></div>
      <div style="text-align: center;"><button href="${url}" class="radius">Ouvrir la gestion de l'équipe</button></div>
      <div style="height: 8px;"></div>
      {{> fr/questions}}
    </columns>
  </row>
</container>
{{> fr/footer}}
